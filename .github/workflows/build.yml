name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # 标签推送时把 tag 传给 Gradle 作为版本号（如 v0.0.1 -> 1.21-0.0.1）；
      # 其余 CI 构建由 GITHUB_SHA 自动生成 1.21-<短 SHA> 版本号。
      - name: Build with Gradle
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            ./gradlew build -Pversion_tag="${GITHUB_REF#refs/tags/}"
          else
            ./gradlew build
          fi